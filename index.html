<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firangi Kanpur</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#fffaf5}
h1,h2,h3{font-family:'Poppins',sans-serif}
header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;background:#fff;position:sticky;top:0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.logo{font-weight:700;font-size:22px;color:#e65100}.btn{padding:10px 18px;border-radius:8px;font-weight:600;text-decoration:none;display:inline-block}.btn-orange{background:#e65100;color:#fff}
.hero{padding:40px 20px;text-align:center;background:linear-gradient(180deg,#fff3e0,#fffaf5)}.hero h1{font-size:34px}.hero h1 span{color:#e65100}
.menu{padding:30px 20px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.06)}.card img{width:100%;height:140px;object-fit:cover}.card-body{padding:12px}.price{font-weight:700;color:#e65100}
.card button{width:100%;margin-top:8px;padding:8px;border:none;border-radius:8px;background:#111;color:#fff;font-weight:600}
#orderModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center;padding:20px}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px}
.modal h3{margin-bottom:12px}.modal input,.modal select,.modal textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px}
.modal .row{display:flex;gap:10px}.modal .row div{flex:1}.close{float:right;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">Firangi Kanpur</div><a class="btn btn-orange" href="https://wa.me/918957924156?text=Hi Firangi, I want to order">Order on WhatsApp</a></header>
<section class="hero"><h1>Desi Swad, <span>Kanpuriya Andaaz</span></h1></section>

<section class="menu"><div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500" alt="Paneer Butter Masala">
<div class="card-body"><h3>Paneer Butter Masala</h3><div class="price">₹250</div><button onclick="openOrder('Paneer Butter Masala',250)">Order</button></div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1626100865515-1afdc1a0b99a?w=500" alt="Butter Naan">
<div class="card-body"><h3>Butter Naan</h3><div class="price">₹60</div><button onclick="openOrder('Butter Naan',60)">Order</button></div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=500" alt="Veg Dum Biryani">
<div class="card-body"><h3>Veg Dum Biryani</h3><div class="price">₹220</div><button onclick="openOrder('Veg Dum Biryani',220)">Order</button></div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=500" alt="Dal Makhani">
<div class="card-body"><h3>Dal Makhani</h3><div class="price">₹180</div><button onclick="openOrder('Dal Makhani',180)">Order</button></div>
</div>

</div></section>

<div id="orderModal"><div class="modal">
<span class="close" onclick="closeModal()">&times;</span>
<h3 id="mTitle">Order Dish</h3>
<div class="row"><div><label>Quantity</label><select id="qty"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div><label>Persons</label><select id="persons"><option>1 Person</option><option>2 Persons</option><option>3 Persons</option><option>4+ Persons</option></select></div></div>
<label>Your Name</label><input id="custName" placeholder="e.g. Rahul">
<label>Special request?</label><textarea id="note" placeholder="Less spicy..."></textarea>
<button class="btn btn-orange" style="width:100%" onclick="sendWhatsApp()">Send to WhatsApp →</button>
</div></div>

<script>
let currentDish='',currentPrice=0;
function openOrder(dish,price){currentDish=dish;currentPrice=price;document.getElementById('mTitle').innerText=dish+' - ₹'+price;document.getElementById('orderModal').style.display='flex'}
function closeModal(){document.getElementById('orderModal').style.display='none'}
function sendWhatsApp(){
let qty=document.getElementById('qty').value;let persons=document.getElementById('persons').value;let name=document.getElementById('custName').value||'Customer';let note=document.getElementById('note').value||'No note';
let total=currentPrice*qty;
let msg=`*NEW ORDER - Firangi Kanpur*%0A%0A👤 Name: ${name}%0A🍛 Dish: ${currentDish}%0A🔢 Qty: ${qty}%0A💰 Total: ₹${total}%0A👥 For: ${persons}%0A📝 Note: ${note}`;
window.open(`https://wa.me/918957924156?text=${msg}`,'_blank');closeModal();
}
</script>
</body>
  </html>
